variables:
  GIT_STRATEGY: clone

stages:
  - create-docker-image
  - vhdl-unit-tests
  - build
  - publish

.common:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == 'merge_request_event'

#Generate the docker image for use in subsequent jobs. This job is run currently run on Tengu directly in a shell gitlab runner but utilising 
#docker which is directly installed on Tengu. This job assumes that Quartus has been downloaded and unzipped to the location  
#/mnt/synvol1/gitlab-runner/quartus/22.4/ and therefore the installable components are available in a directory called 'components'.
create-docker-image:
  stage: create-docker-image
  extends: .common
  tags:
    - ubuntu-18.04
  # before_script:
  script:
    - sudo cp /mnt/synvol1/gitlab-runner/quartus/22.4/components/QuartusProSetup-22.4.0.94-linux.run .
    - sudo cp /mnt/synvol1/gitlab-runner/quartus/22.4/components/quartus_part2-22.4.0.94-linux.qdz .
    - sudo cp /mnt/synvol1/gitlab-runner/quartus/22.4/components/agilex-22.4.0.94.qdz .
    - sudo cp -r /mnt/synvol1/gitlab-runner/quartus/22.4/trialLicense .

   # use symlink instead of copy
    #- mkdir quartus_packages
   # - ln -s /mnt/synvol1/gitlab-runner/quartus/22.4/components/ quartus_packages
    #- ls
    #- cd quartus_packages && ls

    - sudo docker build -t test_image -f dockerfile .
    # clean up
    - sudo rm -r QuartusProSetup-22.4.0.94-linux.run
    - sudo rm -r quartus_part2-22.4.0.94-linux.qdz .
    - sudo rm -r agilex-22.4.0.94.qdz

vhdl-unit-tests:
  stage: vhdl-unit-tests
  extends: .common
  tags:
    - ubuntu-22.04
  script:  
    - echo "vhdl-unit-tests"
    # TODO  

#Runs a full workflow in quartus and generates a .sof image file
build-fdas-fpga-image:
  stage: build
  extends: .common
  image:
    name: test_image
  tags:
    - pss-tengu-docker
  script:
    - cd src/fdas_top 
    - quartus_sh --flow compile fdas_top
  artifacts:
    name: "$CI_COMMIT_REF_NAME-fpga-image"
    paths:
      - src/fdas_top/output_files*
    expire_in: 14 d

publish:
  stage: publish
  extends: .common
  needs:
    - build-fdas-fpga-image
  tags:
    - ubuntu-22.04
  script:
   - echo "publish"
