variables:
  GIT_STRATEGY: clone

stages:
  - vhdl-unit-tests
  - build
  - publish

.common:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == 'merge_request_event'

vhdl-unit-tests:
  stage: vhdl-unit-tests
  extends: .common
  tags:
    - ubuntu-22.04
  script:  
    - echo "vhdl-unit-tests"
    # TODO

#Runs a full workflow in quartus and generates a .sof image file
build-fdas-fpga-image:
  stage: build
  extends: .common
  image:
    name: quartus_docker_image
  tags:
    - pss-tengu-docker
  script:
    - whoami
    - ls -l
    - cd /quartus/22.4/quartus && ls -l
    - cd /quartus/22.4/quartus/bin && ls -l
    - echo $PATH
    - echo $LM_LICENSE_FILE
    - cd $CI_PROJECT_DIR/src/fdas_top 
    - quartus_sh --flow compile fdas_top

publish:
  stage: publish
  extends: .common
  tags:
    - ubuntu-22.04
  script:
   - echo "publish"
