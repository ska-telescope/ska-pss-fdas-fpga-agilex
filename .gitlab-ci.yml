variables:
  GIT_STRATEGY: clone
  QUARTUS_LICENSE_PATH: /mnt/synvol1/gitlab-runner/quartus/22.4/trialLicense
  QUARTUS_COMPONEMENTS_PATH: /mnt/synvol1/gitlab-runner/quartus/22.4/components
  QUARTUS_PRO_RUNFILE: QuartusProSetup-22.4.0.94-linux.run
  QUARTUS_PART2_ZIP: quartus_part2-22.4.0.94-linux.qdz
  AGILEX_SUPPORT_ZIP: agilex-22.4.0.94.qdz

stages:
  - create-docker-image
  - vhdl-unit-tests
  - build
  - publish

.common:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == 'merge_request_event'

#Generate the docker image for use in subsequent jobs. This job is run currently run on Tengu directly in a shell gitlab runner but utilising 
#docker which is directly installed on Tengu. This job assumes that Quartus has been downloaded and unzipped to the location  
#/mnt/synvol1/gitlab-runner/quartus/22.4/ and therefore the installable components are available in a directory called 'components' as this 
#is part of Quartus's directory structure.
create-docker-image:
  stage: create-docker-image
  extends: .common
  tags:
    - ubuntu-18.04
  before_script:
    #Check if image exists and if it does remove it
    - if [ "$(docker images -q test_image:latest 2> /dev/null)" ]; then sudo docker rmi test_image; fi
  script:
    #Copy the Quartus components that we want to install in the container local to this gitlab job. This needs to be done because docker can
    #only 'see' files below the directory it is in. This is temporary solution and in future we should be keeping these files elsewhere suchas
    #the Central Artifact Repository (CAR).
    - sudo cp $QUARTUS_COMPONEMENTS_PATH/$QUARTUS_PRO_RUNFILE .
    - sudo cp $QUARTUS_COMPONEMENTS_PATH/$QUARTUS_PART2_ZIP .
    - sudo cp $QUARTUS_COMPONEMENTS_PATH/$AGILEX_SUPPORT_ZIP .
    #Copy the license file from the local machine. 
    - sudo cp -r $QUARTUS_LICENSE_PATH .
    - sudo docker build -t test_image -f dockerfile .
  after_script:
    #Clean up
    - if [ -f $QUARTUS_PRO_RUNFILE ]; then sudo rm $QUARTUS_PRO_RUNFILE; fi
    - if [ -f $QUARTUS_PART2_ZIP ]; then sudo rm $QUARTUS_PART2_ZIP; fi
    - if [ -f $AGILEX_SUPPORT_ZIP ]; then sudo rm $AGILEX_SUPPORT_ZIP; fi
    - if [ -f trialLicense ]; then sudo rm trialLicense; fi

vhdl-unit-tests:
  stage: vhdl-unit-tests
  extends: .common
  tags:
    - ubuntu-22.04
  script:  
    - echo "vhdl-unit-tests"
    # TODO  

#Runs a full workflow in quartus and generates a .sof image file
build-fdas-fpga-image:
  stage: build
  extends: .common
  image:
    name: test_image
  tags:
    - pss-tengu-docker
  script:
    - cd src/fdas_top 
    - quartus_sh --flow compile fdas_top
  artifacts:
    name: "$CI_COMMIT_REF_NAME-fpga-image"
    paths:
      - src/fdas_top/output_files*
    expire_in: 14 d

publish:
  stage: publish
  extends: .common
  needs:
    - build-fdas-fpga-image
  tags:
    - ubuntu-22.04
  script:
   - cd src/fdas_top/output_files && ls
   - echo "publish"
   # TODO